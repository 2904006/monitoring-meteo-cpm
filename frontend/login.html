<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CPM Essaouira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255,255,255,0.98);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        .role-tabs {
            display: flex;
            gap: 12px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 60px;
            margin-bottom: 32px;
        }
        .role-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            border: none;
            background: transparent;
            transition: all 0.3s;
        }
        .role-tab i { margin-right: 8px; }
        .role-tab.active {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(30,60,114,0.3);
        }
        .btn-login {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 40px;
            width: 100%;
            color: white;
            transition: all 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30,60,114,0.4); }
        .credential-hint {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            margin-top: 20px;
        }
        .alert-danger { border-radius: 16px; }
        .debug-info {
            background: #1e293b;
            color: #a0aec0;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 12px;
            margin-top: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-cloud-sun fa-3x mb-3"></i>
                <h2>CPM Essaouira</h2>
                <p class="mb-0 opacity-75">Centre Provincial de Météorologie</p>
            </div>
            
            <div class="p-4 p-xl-5">
                <div class="role-tabs">
                    <button class="role-tab active" data-role="chef">
                        <i class="fas fa-crown"></i> Chef de centre
                    </button>
                    <button class="role-tab" data-role="employe">
                        <i class="fas fa-user-check"></i> Employé
                    </button>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg" id="username" placeholder="Identifiant" required autocomplete="off">
                    </div>
                    <div class="mb-4">
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-arrow-right-to-bracket me-2"></i>Se connecter
                    </button>
                    <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <span></span>
                    </div>
                </form>
                
                <div class="credential-hint">
                    <div class="small text-muted mb-2">
                        <i class="fas fa-info-circle me-1"></i> Identifiants de test
                    </div>
                    <div id="chefHint" class="small">
                        <strong>👑 Chef :</strong> admin / admin123
                    </div>
                    <div id="employeHint" style="display:none;" class="small">
                        <strong>👥 Employés :</strong><br>
                        kassimi / meteo2026<br>
                        soubai / meteo2026<br>
                        khabiri / meteo2026<br>
                        ayoub / meteo2026
                    </div>
                </div>
                
                <div class="debug-info" id="debugInfo">
                    🔧 Mode debug - Vérifiez la console du terminal
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedRole = 'chef';
        
        // Sélection du rôle
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                selectedRole = tab.dataset.role;
                
                document.getElementById('chefHint').style.display = selectedRole === 'chef' ? 'block' : 'none';
                document.getElementById('employeHint').style.display = selectedRole === 'employe' ? 'block' : 'none';
            });
        });
        
        // Formulaire de connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const errorSpan = errorDiv.querySelector('span');
            const debugInfo = document.getElementById('debugInfo');
            
            // Réinitialiser l'erreur
            errorDiv.style.display = 'none';
            
            if (!username || !password) {
                errorSpan.textContent = 'Veuillez remplir tous les champs';
                errorDiv.style.display = 'block';
                return;
            }
            
            debugInfo.innerHTML = `⏳ Connexion en cours... (${username} / ${selectedRole})`;
            
            try {
                const payload = { username, password, role: selectedRole };
                console.log('Envoi requête:', payload);
                debugInfo.innerHTML = `📤 Envoi: ${JSON.stringify(payload)}`;
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                console.log('Réponse:', data);
                debugInfo.innerHTML = `📥 Réponse: ${JSON.stringify(data)}`;
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify({
                        username: username,
                        role: data.role,
                        name: data.name
                    }));
                    debugInfo.innerHTML = `✅ Connexion réussie! Redirection...`;
                    window.location.href = '/dashboard.html';
                } else {
                    errorSpan.textContent = data.error || 'Identifiants incorrects';
                    errorDiv.style.display = 'block';
                    debugInfo.innerHTML = `❌ Erreur: ${data.error}`;
                }
            } catch (error) {
                console.error('Erreur:', error);
                errorSpan.textContent = 'Erreur de connexion au serveur';
                errorDiv.style.display = 'block';
                debugInfo.innerHTML = `❌ Exception: ${error.message}`;
            }
        });
    </script>
</body>
</html>
