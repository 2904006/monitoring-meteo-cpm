<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CPM Essaouira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255,255,255,0.98);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        .role-tabs {
            display: flex;
            gap: 12px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 60px;
            margin-bottom: 32px;
        }
        .role-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            border: none;
            background: transparent;
            transition: all 0.3s;
        }
        .role-tab i { margin-right: 8px; }
        .role-tab.active {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(30,60,114,0.3);
        }
        .btn-login {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            padding: 14px;
            font-weight: 600;
            border-radius: 40px;
            width: 100%;
            color: white;
            transition: all 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30,60,114,0.4); }
        .alert-danger { border-radius: 16px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-cloud-sun fa-3x mb-3"></i>
                <h2>CPM Essaouira</h2>
                <p class="mb-0 opacity-75">Centre Provincial de Météorologie</p>
            </div>
            
            <div class="p-4 p-xl-5">
                <div class="role-tabs">
                    <button class="role-tab active" data-role="chef">
                        <i class="fas fa-crown"></i> Chef de centre
                    </button>
                    <button class="role-tab" data-role="employe">
                        <i class="fas fa-user-check"></i> Employé
                    </button>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg" id="username" placeholder="Identifiant" required>
                    </div>
                    <div class="mb-4">
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-arrow-right-to-bracket me-2"></i>Se connecter
                    </button>
                    <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let selectedRole = 'chef';
        
        // Sélection du rôle
        const roleTabs = document.querySelectorAll('.role-tab');
        
        if (roleTabs) {
            roleTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    roleTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    selectedRole = tab.dataset.role;
                });
            });
        }
        
        // Formulaire de connexion
        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim().toLowerCase();
                const password = document.getElementById('password').value;
                
                if (errorDiv) {
                    errorDiv.style.display = 'none';
                    errorDiv.innerHTML = '';
                }
                
                if (!username || !password) {
                    if (errorDiv) {
                        errorDiv.innerHTML = 'Veuillez remplir tous les champs';
                        errorDiv.style.display = 'block';
                    }
                    return;
                }
                
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, role: selectedRole })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        localStorage.setItem('user', JSON.stringify({
                            username: username,
                            role: data.role,
                            name: data.name
                        }));
                        window.location.href = '/dashboard.html';
                    } else {
                        if (errorDiv) {
                            errorDiv.innerHTML = data.error || 'Identifiants incorrects';
                            errorDiv.style.display = 'block';
                        }
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    if (errorDiv) {
                        errorDiv.innerHTML = 'Erreur de connexion au serveur';
                        errorDiv.style.display = 'block';
                    }
                }
            });
        }
    </script>
</body>
</html>
